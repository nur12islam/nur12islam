<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DARKI system core</title>
  <desc id="desc">An animated futuristic command-center visualization for Nur Islam, known as DARKI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.55" stop-color="#071522"/>
      <stop offset="1" stop-color="#02060c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00e5ff" stroke-opacity=".055"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .fade{animation:fade 3.2s ease-in-out infinite alternate}
      .spin{transform-origin:600px 210px;animation:spin 18s linear infinite}
      .spin2{transform-origin:600px 210px;animation:spin 11s linear infinite reverse}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      .scan{animation:scan 4.5s linear infinite}
      .blink{animation:blink 1.1s steps(2,end) infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
      @keyframes fade{from{opacity:.35}to{opacity:1}}
      @keyframes scan{from{transform:translateY(-180px);opacity:0}15%{opacity:.7}70%{opacity:.7}to{transform:translateY(180px);opacity:0}}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="url(#grid)" stroke="#00e5ff" stroke-opacity=".18"/>
  <g opacity=".5" class="mono" font-size="10" fill="#5f7f8c">
    <text x="28" y="30">DARKI//CORE_NODE_01</text>
    <text x="1015" y="30">SECURE CHANNEL</text>
    <text x="28" y="398">NUR12ISLAM.DEV</text>
    <text x="1010" y="398">BUILD • DESIGN • EXPLORE</text>
  </g>

  <g class="scan">
    <rect x="55" y="45" width="1090" height="2" fill="url(#cyan)" filter="url(#glow)"/>
  </g>

  <g class="spin" fill="none" stroke="#00e5ff">
    <ellipse cx="600" cy="210" rx="250" ry="105" stroke-opacity=".16"/>
    <ellipse cx="600" cy="210" rx="250" ry="105" stroke-opacity=".16" transform="rotate(60 600 210)"/>
    <ellipse cx="600" cy="210" rx="250" ry="105" stroke-opacity=".16" transform="rotate(120 600 210)"/>
    <circle cx="850" cy="210" r="5" fill="#00e5ff" filter="url(#glow)"/>
  </g>
  <g class="spin2" fill="none" stroke="#7cefff">
    <ellipse cx="600" cy="210" rx="205" ry="78" stroke-opacity=".14" transform="rotate(25 600 210)"/>
    <circle cx="805" cy="210" r="3.5" fill="#7cefff" filter="url(#glow)"/>
  </g>

  <g class="pulse" transform="translate(600 210)">
    <circle r="78" fill="#06121d" stroke="#00e5ff" stroke-opacity=".35"/>
    <circle r="62" fill="none" stroke="#00e5ff" stroke-opacity=".7"/>
    <circle r="48" fill="none" stroke="#00e5ff" stroke-opacity=".16" stroke-dasharray="3 7"/>
    <circle r="8" fill="#00e5ff" filter="url(#glow)"/>
  </g>

  <g class="mono" text-anchor="middle">
    <text x="600" y="199" fill="#ffffff" font-size="30" font-weight="800" letter-spacing="5">DARKI</text>
    <text x="600" y="224" fill="#00e5ff" font-size="10" letter-spacing="3">CORE ONLINE</text>
    <text x="600" y="242" fill="#6b8792" font-size="8" letter-spacing="2">NUR ISLAM</text>
  </g>

  <g class="mono" font-size="10">
    <g transform="translate(75 105)">
      <rect width="235" height="62" rx="8" fill="#06101a" stroke="#00e5ff" stroke-opacity=".2"/>
      <circle cx="18" cy="20" r="4" fill="#00e5ff" class="blink"/>
      <text x="32" y="24" fill="#00e5ff">MOBILE</text>
      <text x="18" y="45" fill="#7c929c">ANDROID / GRADLE</text>
    </g>
    <g transform="translate(890 105)">
      <rect width="235" height="62" rx="8" fill="#06101a" stroke="#00e5ff" stroke-opacity=".2"/>
      <circle cx="18" cy="20" r="4" fill="#00e5ff" class="blink"/>
      <text x="32" y="24" fill="#00e5ff">AUTOMATION</text>
      <text x="18" y="45" fill="#7c929c">TELEGRAM / LINUX</text>
    </g>
    <g transform="translate(75 268)">
      <rect width="235" height="62" rx="8" fill="#06101a" stroke="#00e5ff" stroke-opacity=".2"/>
      <circle cx="18" cy="20" r="4" fill="#00e5ff" class="blink"/>
      <text x="32" y="24" fill="#00e5ff">CREATIVE</text>
      <text x="18" y="45" fill="#7c929c">UI/UX / VIDEO / GRAPHICS</text>
    </g>
    <g transform="translate(890 268)">
      <rect width="235" height="62" rx="8" fill="#06101a" stroke="#00e5ff" stroke-opacity=".2"/>
      <circle cx="18" cy="20" r="4" fill="#00e5ff" class="blink"/>
      <text x="32" y="24" fill="#00e5ff">INTELLIGENCE</text>
      <text x="18" y="45" fill="#7c929c">WEB / AI / EXPERIMENTS</text>
    </g>
  </g>

  <g class="mono fade" font-size="9" fill="#00e5ff">
    <text x="600" y="82" text-anchor="middle">◈ SYNCHRONIZING CREATIVE + CODE SYSTEMS ◈</text>
    <text x="600" y="355" text-anchor="middle" fill="#6b8792">[ SYSTEM STATUS: ACTIVE ] <tspan class="blink">_</tspan></text>
  </g>
</svg>